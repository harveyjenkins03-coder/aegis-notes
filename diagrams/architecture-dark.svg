<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">How AEGIS is put together</title><desc id="d">A React control surface talks over loopback to a FastAPI backend. Behind it sit the local inference boundary, retrieval and evaluation, the vault and the admission preflight, all under fail-closed gates. A release manager stages updates and rolls them back.</desc><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><rect x="7" y="7" width="2" height="2" fill="#262c34"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7480"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e09f3e"/></marker></defs><rect x="1" y="1" width="958" height="658" rx="12" fill="#181b20" stroke="#323a44" stroke-width="1.5"/><rect x="1" y="1" width="958" height="658" rx="12" fill="url(#dots)"/><text x="32" y="44" font-size="20" font-weight="600" fill="#ece4d6" text-anchor="start">How AEGIS is put together</text><text x="32" y="68" font-size="14" font-weight="400" fill="#a7afb8" text-anchor="start">Everything runs on one machine. Amber marks what refuses by default.</text><rect x="32" y="92" width="896" height="66" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="46" y="116" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start">React control surface</text><text x="46" y="137" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">Loopback only, with a session token minted per process</text><path d="M480,158 L480,190" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><text x="494" y="180" font-size="12" font-weight="400" fill="#a7afb8" text-anchor="start">56 API routes</text><rect x="32" y="190" width="896" height="66" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="46" y="214" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start">FastAPI backend (Python 3.12)</text><text x="46" y="235" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">What a client or a model asserts stays untrusted until a deterministic check confirms it</text><path d="M140,256 L140,288" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><path d="M368,256 L368,288" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><path d="M592,256 L592,288" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><path d="M820,256 L820,288" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><rect x="32" y="288" width="212" height="110" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="46" y="312" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start">Local inference</text><text x="46" y="333" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">llama.cpp on Vulkan,</text><text x="46" y="352" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">hash-pinned build,</text><text x="46" y="371" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">no remote providers</text><rect x="260" y="288" width="212" height="110" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="274" y="312" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start">Retrieval and evals</text><text x="274" y="333" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">embeddings, reranker,</text><text x="274" y="352" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">held-out evals gated</text><text x="274" y="371" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">by provenance</text><rect x="484" y="288" width="212" height="110" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="498" y="312" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start">Vault</text><text x="498" y="333" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">Argon2id and</text><text x="498" y="352" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">AES-256-GCM, opaque</text><text x="498" y="371" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">vault:// handles</text><rect x="712" y="288" width="216" height="110" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="726" y="312" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start">Admission preflight</text><text x="726" y="333" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">RAM, VRAM and disk</text><text x="726" y="352" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">checked before any</text><text x="726" y="371" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">model launch</text><rect x="32" y="422" width="896" height="88" rx="8" fill="#2c261d" stroke="#e09f3e" stroke-width="1.5"/><text x="46" y="446" font-size="15" font-weight="600" fill="#e09f3e" text-anchor="start">Fail-closed gates</text><text x="46" y="467" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">Code execution is refused until an isolation backend passes its gate; memory writes until a verifier exists</text><text x="46" y="486" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">Fetching is pinned against SSRF; interactive browsing and vault autofill are off</text><rect x="32" y="534" width="896" height="88" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="46" y="558" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start">Release manager</text><text x="46" y="579" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">A staged update journal: validated, activation pending, then healthy or rolled back automatically</text><text x="46" y="598" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">Runtimes built offline from a hash-pinned wheelhouse; any package index lookup fails the build</text><text x="32" y="648" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">Simplified from the private source. Names match the modules it describes.</text></svg>
